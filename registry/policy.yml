# Global policy for every agent session. Humans change it via PR.

# Maximum cloud sessions running agent work at the same time, across all repos.
max_parallel_sessions: 3

# Maximum implementation tasks (ai:in-progress) per repo at the same time.
max_parallel_tasks_per_repo: 1

# Changes up to this many changed lines that touch only docs, comments, or
# typos may skip design and planning. They still need a PR and human approval.
trivial_change_max_lines: 20

# Gates. Agents never pass a gate on their own.
gates:
  design: pr_merge          # Gate 1: a human merges the design PR
  code: human_pr_approval   # Gate 2: a human approves the code PR
  production: human_only    # Gate 3: never by an agent (Coolify or protected branch)

# Every pipeline label starts with this prefix, except size:small / size:large.
labels_namespace: "ai:"

# Plan usage budget. The orchestrator checks it with the usage-status skill
# before it delegates work. Percent of the five-hour limit only; the weekly
# percent is informational (owner, 2026-11-20). See CLAUDE.md -> "Usage budget".
usage_budget:
  caution_pct: 70   # at or above: light stages only
  pause_pct: 90     # at or above: no new stage work

# Heavy items (implementation, planning, design, fix round) one batch run may delegate back to back.
# The run keeps picking while usage advice is proceed and ready work remains, up to this cap (owner, 2026-11-22).
max_heavy_items_per_run: 5

# Cap for every fix loop. Count >= cap stops the loop. Labels per loop: CLAUDE.md -> "Stop cleanly".
max_fix_attempts: 3

# Repo that hosts daily report issues and briefs.
control_repo: alta-prima-indonesia/claude-cowork

# GitHub Project board. .github/workflows/project-sync.yml mirrors pipeline
# labels into it. Agents never write to the Project. number 0 disables the sync.
# owner: a GitHub user or organization login. Project #2 still lives under the user
# account altaprimadev; keep it until a Project exists in the alta-prima-indonesia org.
# The Status field must have one option per value in scripts/project_sync.py STATUS_ORDER.
project:
  owner: altaprimadev
  number: 2
  status_field: Status
