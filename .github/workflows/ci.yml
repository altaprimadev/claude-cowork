# CI for claude-cowork.
# Runs the config validator and the guard hook tests on every PR and on main.
# The job name `validate` is the required status check for branch protection:
#   scripts/setup-branch-protection.sh alta-prima-indonesia/claude-cowork --check validate

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pytest

      - name: Validate .claude config, registry, and templates
        run: python scripts/validate-config.py

      - name: Test guard hook
        run: python -m pytest tests/ -v

      - name: Check shell script syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done
